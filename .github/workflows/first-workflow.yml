name: My First Workflow

on:
  push:
    branches: [main]

  workflow_dispatch:

  schedule:
    - cron: '0 9 * * *'

jobs:

  build:
    runs-on: ubuntu-latest

    env:
      APP_NAME: github-actions-practice
      ENVIRONMENT: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Build application
        run: |
          echo "Building $APP_NAME"
          echo "Environment: $ENVIRONMENT"
          echo "Build completed successfully"

      - name: Create build artifact
        run: |
          mkdir -p output
          echo "Build artifact for github-actions-practice" > output/build-info.txt
          cat output/build-info.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: output/build-info.txt

      - name: Check step-level environment
        env:
          STEP_MESSAGE: "This is a step-level variable"
        run: |
          echo "Application: $APP_NAME"
          echo "Environment: $ENVIRONMENT"
          echo "Message: $STEP_MESSAGE"

      - name: Check step variable scope
        run: |
          echo "Application: $APP_NAME"
          echo "Environment: $ENVIRONMENT"
          echo "Step message: $STEP_MESSAGE"

      - name: Test repository secret
        env:
          DEMO_SECRET: ${{ secrets.DEMO_SECRET }}
        run: |
          echo "Repository secret is available."
          echo "Secret length: ${#DEMO_SECRET}"


  test:
    runs-on: ubuntu-latest
    needs: build

    env:
      APP_NAME: github-actions-practice
      ENVIRONMENT: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: downloaded-output

      - name: Verify downloaded artifact
        run: |
          echo "Checking downloaded build artifact..."
          cat downloaded-output/build-info.txt
          test -f downloaded-output/build-info.txt
          echo "Artifact verification passed!"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: node node_modules/playwright/cli.js install --with-deps

      - name: Run Playwright tests
        run: node node_modules/playwright/cli.js test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/


  deploy:
    runs-on: ubuntu-latest
    needs: test

    environment:
      name: staging

    env:
      APP_NAME: github-actions-practice
      ENVIRONMENT: staging

    steps:
      - name: Deploy application
        run: |
          echo "Deploying $APP_NAME"
          echo "Environment: $ENVIRONMENT"
          echo "Deployment completed successfully"